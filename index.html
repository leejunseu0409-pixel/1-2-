    <meta charset="UTF-8">

<body>

<div class="container">

    <h1>📢 이쁜2반 공지 알리미</h1>
<p id="userName"></p>
    <!-- 공지 작성 -->
    <div class="write-box" id="writebox>
        <h2>✏️ 공지 작성</h2>
<select id="category">
    <option value="알림">📢 알림</option>
    <option value="수행평가">📝 수행평가</option>
    <option value="준비물">🎒 준비물</option>
    <option value="일정">📅 일정</option>
    <option value="기타">📌 기타</option>
</select>
        <input id="title" type="text" placeholder="공지 제목">

        <textarea id="content" placeholder="공지 내용을 입력하세요"></textarea>
<input id="dueDate" type="date">
        <label class="check">
            <input id="important" type="checkbox">
            ⭐ 중요 공지
        </label>

        <button class="add-button" onclick="addNotice()">
            공지 등록
        </button>
    </div>
<script>
const ADMIN_UID = "bc21e745-a6f6-47d1-b826-e2d5ee898808";

supabaseClient.auth.getSession().then(({ data: { session } }) => {

    <!-- 새 공지가 들어갈 곳 -->
    <div id="noticeList"></div>

</div>

<script>
async function loadNotices() {
    const { data, error } = await supabaseClient
        .from("notices")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        console.error("공지 불러오기 실패:", error);
        return;
    }

    document.getElementById("noticeList").innerHTML = "";

    data.forEach(notice => {
        createNotice(
            notice.title,
            notice.content,
            notice.important,
            new Date(notice.created_at).toLocaleDateString("ko-KR"),
            false,
            ""
        );
    });
}

function saveNotices() {
    const notices = [];

    document.querySelectorAll("#noticeList .notice").forEach(notice => {
        notices.push({
            title: notice.querySelector("h2").innerText.replace("⭐ ", ""),
            content: notice.querySelector("p").innerText,
            important: notice.classList.contains("important"),
           date: notice.querySelector(".date").innerText,
edited: notice.querySelector(".edited") !== null,
dueDate: notice.dataset.dueDate || ""
        });
    });

    localStorage.setItem("classNotices", JSON.stringify(notices));
}

function createNotice(title, content, important, date, edited = false, dueDate = "") {
    const notice = document.createElement("div");

    notice.className = "notice";
notice.dataset.dueDate = dueDate;
    if (important) {
        notice.classList.add("important");
    }

    notice.innerHTML = `
        <h2>${important ? "⭐ " : ""}${title}</h2>
        <p>${content}</p>
        <div class="date">${date}</div>
${dueDate ? `<div class="dday">D-${Math.ceil((new Date(dueDate) - new Date()) / 86400000)}</div>` : ""}
        ${edited ? '<small class="edited">(수정됨)</small>' : ''}
        <button class="edit-button">✏️ 수정</button>
        <button class="delete-button">🗑 삭제</button>
    `;

    notice.querySelector(".delete-button").onclick = function() {
        notice.remove();
        saveNotices();
    };

    notice.querySelector(".edit-button").onclick = function() {
        const newTitle = prompt("새 제목을 입력하세요", title);
        if (newTitle === null) return;

        const newContent = prompt("새 내용을 입력하세요", content);
        if (newContent === null) return;

        notice.querySelector("h2").innerText =
            important ? "⭐ " + newTitle : newTitle;

        notice.querySelector("p").innerText = newContent;
notice.querySelector("p").innerText = newContent;

notice.querySelector(".edited")?.remove();

const edited = document.createElement("small");
edited.className = "edited";
edited.innerText = "(수정됨)";
notice.appendChild(edited);

saveNotices();
        saveNotices();
    };

    document.getElementById("noticeList").prepend(notice);
}
async function addNotice() {
    const title = document.getElementById("title").value;
    const category = document.getElementById("category").value;
    const content = document.getElementById("content").value;
    const important = document.getElementById("important").checked;

    if (title.trim() === "" || content.trim() === "") {
        alert("제목과 내용을 입력해주세요!");
        return;
    }

    const { error } = await supabaseClient
        .from("notices")
        .insert({
           title: title,
content: content,
category: category,
important: important 
        });

    if (error) {
        console.error("공지 등록 실패:", error);
        alert("공지 등록에 실패했습니다.");
        return;
    }

    document.getElementById("title").value = "";
    document.getElementById("content").value = "";
    document.getElementById("important").checked = false;

    await loadNotices();
}

loadNotices();
supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
    if (session) {
        let name = session.user.user_metadata?.name;

       if (!name || name === "사용자") {
    const newName = prompt("사용할 이름을 입력해주세요.");

    if (newName) {
        const { data, error } = await supabaseClient.auth.updateUser({
            data: { name: newName }
        });

        if (error) {
            console.error("이름 저장 실패: " + error.message);
        } else {
            name = data.user.user_metadata.name;
        }
    }
}

        document.getElementById("userName").textContent =
            (name || "사용자") + "님";
    }
});
</script>
