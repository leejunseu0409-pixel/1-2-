<!DOCTYPE html>
<html lang="ko">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
const SUPABASE_URL = "https://ktirenvqucjuxxcccjof.supabase.co/";
const SUPABASE_ANON_KEY = "sb_publishable_gJVZxM4sn7HTCx5f-4gVXw_BnFkCpsa";

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이쁜2반 공지 알리미</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        h1 {
            text-align: center;
        }

        .write-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-top: 25px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        input[type="text"], textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .check {
            display: block;
            margin-top: 12px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 15px;
        }

        .add-button {
            width: 100%;
            margin-top: 12px;
            background: #222;
            color: white;
        }

        .notice {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .important {
            border-left: 6px solid red;
        }

        .date {
            color: #777;
            font-size: 14px;
        }

        .delete-button {
            background: #eeeeee;
            margin-top: 10px;
        }
    select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: white;
    font-size: 15px;
}
.menu-button {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 1001;
    font-size: 24px;
    border: none;
    background: white;
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
}

.side-menu {
    position: fixed;
    top: 0;
    left: -260px;
    width: 240px;
    height: 100vh;
    background: white;
    box-shadow: 3px 0 15px rgba(0,0,0,0.2);
    z-index: 1000;
    padding-top: 80px;
    transition: left 0.25s ease;
}

.side-menu.open {
    left: 0;
}

.side-menu button {
    display: block;
    width: 100%;
    padding: 18px;
    border: none;
    background: white;
    text-align: left;
    font-size: 17px;
    cursor: pointer;
}

.side-menu button:hover {
    background: #f2f2f2;
}
    </style>
</head>

<body>
<button class="menu-button" onclick="toggleSideMenu()">☰</button>

<div id="sideMenu" class="side-menu">
    <button onclick="showNotices(); closeSideMenu()">📢 공지사항</button>
    <button onclick="showMembers(); closeSideMenu()">👥 Members</button>
    <button onclick="logout()">🚪 로그아웃</button>
</div>
<div class="container">

    <h1>📢 이쁜2반 공지 알리미</h1>
<p id="userName"></p>
    <!-- 공지 작성 -->
    <div class="write-box" id="writebox">
        <h2>✏️ 공지 작성</h2>
<select id="category">
    <option value="알림">📢 알림</option>
    <option value="수행평가">📝 수행평가</option>
    <option value="준비물">🎒 준비물</option>
    <option value="일정">📅 일정</option>
    <option value="기타">📌 기타</option>
</select>
        <input id="title" type="text" placeholder="공지 제목">

        <textarea id="content" placeholder="공지 내용을 입력하세요"></textarea>
<input id="dueDate" type="date">
        <label class="check">
            <input id="important" type="checkbox">
            ⭐ 중요 공지
        </label>

        <button class="add-button" onclick="addNotice()">
            공지 등록
        </button>
    </div>
<script>
const ADMIN_UID = "bc21e745-a6f6-47d1-b826-e2d5ee898808";

supabaseClient.auth.getSession().then(({ data: { session } }) => {
    if (!session) return;

    if (session.user.id !== ADMIN_UID) {
        document.getElementById("writeBox").style.display = "none";
    }
});
</script>
  

   

    <!-- 새 공지가 들어갈 곳 -->
    <div id="noticeList"></div>

</div>
<script>
async function loadNotices() {
    const { data, error } = await supabaseClient
        .from("notices")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        console.error("공지 불러오기 실패:", error);
        return;
    }

    document.getElementById("noticeList").innerHTML = "";

    data.forEach(notice => {
        createNotice(
            notice.id,
            notice.title,
            notice.content,
            notice.important,
            new Date(notice.created_at).toLocaleDateString("ko-KR"),
            false,
            "",
            notice.category
        );
    });
}
async function editNotice(id, newTitle, newContent, newCategory, newImportant) {
    const { error } = await supabaseClient
        .from("notices")
        .update({
            title: newTitle,
            content: newContent,
            category: newCategory,
            important: newImportant
        })
        .eq("id", id);

    if (error) {
        console.error("공지 수정 실패:", error);
        alert("공지 수정에 실패했습니다.");
        return;
    }

    await loadNotices();
}
async function deleteNotice(id) {
    if (!confirm("이 공지를 삭제할까요?")) return;

    const { error } = await supabaseClient
        .from("notices")
        .delete()
        .eq("id", id);

    if (error) {
        console.error("공지 삭제 실패:", error);
        alert("공지 삭제에 실패했습니다.");
        return;
    }

    await loadNotices();
}
function saveNotices() {
    const notices = [];

    document.querySelectorAll("#noticeList .notice").forEach(notice => {
        notices.push({
            title: notice.querySelector("h2").innerText.replace("⭐ ", ""),
            content: notice.querySelector("p").innerText,
            important: notice.classList.contains("important"),
           date: notice.querySelector(".date").innerText,
edited: notice.querySelector(".edited") !== null,
dueDate: notice.dataset.dueDate || ""
        });
    });

    localStorage.setItem("classNotices", JSON.stringify(notices));
}

function createNotice(id, title, content, important, date, edited = false, dueDate = "", category = "알림") {
    const notice = document.createElement("div");
    notice.className = "notice";
    notice.dataset.id = id;
    notice.dataset.dueDate = dueDate;

    if (important) {
        notice.classList.add("important");
    }

    notice.innerHTML = `
        <h2>${important ? "⭐ " : ""}${title}</h2>
        <p>${content}</p>
        <div class="date">${date}</div>
        <div class="category">
  ${category === "알림" ? "📢 알림" :
    category === "수행평가" ? "📄 수행평가" :
    category === "준비물" ? "🎒 준비물" :
    category === "일정" ? "🗓️ 일정" :
    "📌 기타"}
</div>
        ${dueDate ? `<div class="dday">D-${Math.ceil((new Date(dueDate) - new Date()) / 86400000)}</div>` : ""}
        ${edited ? '<small class="edited">(수정됨)</small>' : ""}
        <div class="like-area">
    <button class="like-button" onclick="likeNotice('${id}')">❤️ 좋아요</button>
    <span class="like-count" data-like-count="${id}">0</span>
</div>
        <button class="edit-button">✏️ 수정</button>
        <button class="delete-button">🗑️ 삭제</button>
    `;

    notice.querySelector(".delete-button").onclick = async function () {
        const { error } = await supabaseClient
            .from("notices")
            .delete()
            .eq("id", id);

        if (error) {
            console.error("공지 삭제 실패:", error);
            alert("공지 삭제에 실패했습니다.");
            return;
        }

        notice.remove();
    };

    notice.querySelector(".edit-button").onclick = function () {
        const newTitle = prompt("새 제목을 입력하세요", title);
        if (newTitle === null) return;

        const newContent = prompt("새 내용을 입력하세요", content);
        if (newContent === null) return;

        editNotice(id, newTitle, newContent, category, important, dueDate);
    };

    document.getElementById("noticeList").prepend(notice);
}
async function addNotice() {
    const title = document.getElementById("title").value;
    const category = document.getElementById("category").value;
    const content = document.getElementById("content").value;
    const important = document.getElementById("important").checked;

    if (title.trim() === "" || content.trim() === "") {
        alert("제목과 내용을 입력해주세요!");
        return;
    }

    const { error } = await supabaseClient
        .from("notices")
        .insert({
           title: title,
content: content,
category: category,
important: important 
        });

    if (error) {
        console.error("공지 등록 실패:", error);
        alert("공지 등록에 실패했습니다.");
        return;
    }

    document.getElementById("title").value = "";
    document.getElementById("content").value = "";
    document.getElementById("important").checked = false;

    await loadNotices();
}

loadNotices();
supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
    if (session) {
        let name = session.user.user_metadata?.name;

       if (!name || name === "사용자") {
    const newName = prompt("사용할 이름을 입력해주세요.");

    if (newName) {
        const { data, error } = await supabaseClient.auth.updateUser({
            data: { name: newName }
        });

        if (error) {
            console.error("이름 저장 실패: " + error.message);
        } else {
            name = data.user.user_metadata.name;
        }
    }
}

        document.getElementById("userName").textContent =
            (name || "사용자") + "님";
    }
});
function toggleSideMenu() {
    document.getElementById("sideMenu").classList.toggle("open");
}

function closeSideMenu() {
    document.getElementById("sideMenu").classList.remove("open");
}

function showNotices() {
    document.getElementById("noticeList").style.display = "block";
    closeSideMenu();
}

async function showMembers() {
    const { data, error } = await supabaseClient
        .from("profiles")
        .select("name")
        .order("name");

    if (error) {
        console.error(error);
        return;
    }

    const menu = document.getElementById("sideMenu");

    menu.innerHTML = `
        <h2 style="padding: 0 20px;">👥 Members</h2>
        <div style="padding: 0 20px;">
            ${data.map(user => `<p>• ${user.name}</p>`).join("")}
        </div>
        <button onclick="location.reload()">← 돌아가기</button>
    `;

    menu.classList.add("open");
}

async function logout() {
    if (!confirm("로그아웃하시겠습니까?")) {
        return;
    }

    const { error } = await supabaseClient.auth.signOut();

    if (error) {
        console.error("로그아웃 실패:", error);
        alert("로그아웃에 실패했습니다.");
        return;
    }

    window.location.href = "login.html";
}
async function likeNotice(noticeId) {
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!session) {
        alert("로그인이 필요합니다.");
        return;
    }

    const { error } = await supabaseClient
        .from("likes")
        .insert({
            notice_id: noticeId,
            user_id: session.user.id
        });

     if (error) {
    if (error.code === "23505") {
        alert("이미 좋아요를 눌렀습니다.");
    } else {
        console.error("좋아요 실패:", error);
        alert("좋아요에 실패했습니다.");
    }
    return;
}

const count = document.querySelector(
    `[data-like-count="${noticeId}"]`
);

if (count) {
    count.textContent = Number(count.textContent) + 1;
}

    
}
</script>

</body>
</html>
